<!DOCTYPE html>
<html>
    <head>
         <title>CSS practice</title>
         <style>
            body{
                background-color:rgb(171, 30, 184);
            }
            .personal-info{
                background-color:rgb(70, 210, 222);
                
            }
            .address-info{
                background-color:lightyellow;
                
            }
            h1{
                color:blue;
                background-color: bisque;
            }
            #name{
                color:rgb(24, 160, 26);
            }
            #age{
                color:orange;
            }

         </style>

    </head>
    <body>
        <h1> Biodata</h1>
        <div class="personal-info">
            <h3>Personal Information</h3>
            <p id="name">Name:Varshini</p>
            <p id="age">Age:18</p>
            <p id="qualification">Qualification: B.Tech</p>
        </div>
        <div class="address-info">
            <h3>Address Information</h3>
            <p id="house-no">H.no:123</p>
            <p id="street">Street:Main Street</p>
            <p id="country">country:India</p>
        </div>
    </body>
</html>
