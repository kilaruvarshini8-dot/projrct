<!DOCTYPE html>
<html>
    <head>
        <title>This is my register page</title>
    </head>
    <body>
        <h1>This is Register Page</h1>
        <p>Login | <a href="register.html">Register</a></p>

        <form>
            <fieldset>
                <legend><b>Personal Information</b></legend>
            <label><b>Name:</b></label>
            <input type="text" placeholder="Enter your name here">

            <br><br>
            
            <label><b>Email:</b></label>
            <input type="email" placeholder="Enter your email here">
            
            <br><br>
            
            <label><b>Password:</b></label>
            <input type="password" placeholder="Enter your password here">
            
            <br><br>

            <label><b>Confirm Password:</b></label>
            <input type="password" placeholder="Enter your password again">
            </fieldset>
            <br><br>

            <fieldset>
                <legend><b>Address Details</b></legend>
            <label><b>Hno:</b></label>
            <input type="text" placeholder="Enter your house no ">

            <br><br>
            <label><b>State:</b></label>
            <input type="text" placeholder="Enter your state">
            <br><br>
            <label><b>Country:</b></label>
            <select>
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>

            <br><br>
            <label><b>Full Address:</b></label>
            <input type="text" placeholder="Enter your full address">

            </fieldset>
            <fieldset>
                <legend>Product interested</legend>
                <legend><b>Product category</b></legend><br>
                <label>Fashion</label><input type="checkbox" name="category">
                <label>Electronics</label><input type="checkbox" name="category">
                <label>Books</label><input type="checkbox" name="category">
                <label>Toys</label><input type="checkbox" name="category">
                <label>Mobiles</label><input type="checkbox" name="category">
                <br><br>
                <label><b>Shoping for:</b></label>
                <input type="radio" name="shoppingfor" ><label> ForSelf</label>
                <input type="radio" name="shoppingfor" ><label>For Family</label>


            </fieldset>
            <br><br>
            <input type="submit" placeholder="Enter">
        </form>
    </body>
</html>
